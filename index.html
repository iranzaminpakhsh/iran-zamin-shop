<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پخش ایران زمین</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #f4f6fa;
      color: #17233b;
      text-align: center;
    }
    header {
      background: #101d38;
      color: #d8b66a;
      padding: 35px 15px;
    }
    h1 { margin: 0 0 12px; }
    main { padding: 35px 18px; }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }
    button {
      background: #d8b66a;
      border: 0;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>پخش ایران زمین</h1>
    <p>فروش عمده مواد غذایی و تنقلات</p>
  </header>

  <main>
    <div class="card">
      <h2>به فروشگاه ایران زمین خوش آمدید</h2>
      <p>انواع نوشیدنی، چیپس، پفک، شکلات و محصولات سوپرمارکتی</p>
      <h2>محصولات پخش ایران زمین</h2>

<div id="products">
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://zpzgobwtmihmxguaugjd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_77wkgLWrbGoPeH9K-cCP_w_00P2HNEZ";
  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  async function loadProducts() {
  const { data, error } = await db
    .from('products')
    .select('name, price, unit')
    .eq('is_active', true);

  if (error) {
    console.error('Error loading products:', error);
    return;
  }

  const container = document.getElementById('products');

container.innerHTML = data.map(product => `
  <div class="card">
    <h3>${product.name}</h3>
    <p>${product.unit || ''}</p>
    <strong>${Number(product.price).toLocaleString('fa-IR')} تومان</strong>
  </div>
`).join('');
}

loadProducts();
</script>
</body>
</html>
