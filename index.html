<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پخش ایران زمین</title>
  <style>
    body {
      margin: 0;
      font-family: Tahoma, sans-serif;
      background: #f4f6fa;
      color: #17233b;
      text-align: center;
    }
    header {
      background: #101d38;
      color: #d8b66a;
      padding: 35px 15px;
    }
    h1 { margin: 0 0 12px; }
    main { padding: 35px 18px; }
    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #0001;
    }
    button {
      background: #d8b66a;
      border: 0;
      border-radius: 10px;
      padding: 14px 25px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>پخش ایران زمین</h1>
    <p>فروش عمده مواد غذایی و تنقلات</p>
  </header>

  <main>
    <div class="card">
      <h2>به فروشگاه ایران زمین خوش آمدید</h2>
      <p>انواع نوشیدنی، چیپس، پفک، شکلات و محصولات سوپرمارکتی</p>
      <button disabled>محصولات به‌زودی</button>
    </div>
  </main>
</body>
</html>
